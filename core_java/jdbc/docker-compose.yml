version: "3.3"
services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  jdbc-app:
    image: my-java-app
    tty: true
    stdin_open: true
    depends_on:
      - postgres
volumes:
  pgdata:
    external: true